name: cinewise

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      TZ: Asia/Shanghai
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST is required}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-cinewise}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_AUDIT_HASH_SECRET: ${AUTH_AUDIT_HASH_SECRET:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-30m}
      AUTH_RENEWAL_THRESHOLD: ${AUTH_RENEWAL_THRESHOLD:-10m}
      AUTH_ABSOLUTE_SESSION_TTL: ${AUTH_ABSOLUTE_SESSION_TTL:-8h}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CINEWISE_CORS_ALLOWED_ORIGINS: ${CINEWISE_CORS_ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:5173}
      AUTH_DEMO_SEED_ENABLED: ${AUTH_DEMO_SEED_ENABLED:-false}
      AUTH_DEMO_USER_EMAIL: ${AUTH_DEMO_USER_EMAIL:-}
      AUTH_DEMO_USER_PASSWORD: ${AUTH_DEMO_USER_PASSWORD:-}
      AUTH_DEMO_USER_NICKNAME: ${AUTH_DEMO_USER_NICKNAME:-}
      AUTH_DEMO_ADMIN_EMAIL: ${AUTH_DEMO_ADMIN_EMAIL:-}
      AUTH_DEMO_ADMIN_PASSWORD: ${AUTH_DEMO_ADMIN_PASSWORD:-}
      AUTH_DEMO_ADMIN_NICKNAME: ${AUTH_DEMO_ADMIN_NICKNAME:-}
      AUTH_DEMO_PRIVACY_POLICY_VERSION: ${AUTH_DEMO_PRIVACY_POLICY_VERSION:-}
      TICKET_LOCK_MINUTES: ${TICKET_LOCK_MINUTES:-15}
      ORDER_PAYMENT_MINUTES: ${ORDER_PAYMENT_MINUTES:-15}
      CINEWISE_CONTENT_NETSTART_ENABLED: ${CINEWISE_CONTENT_NETSTART_ENABLED:-false}
      CINEWISE_CONTENT_NETSTART_SYNC_ON_STARTUP: ${CINEWISE_CONTENT_NETSTART_SYNC_ON_STARTUP:-false}
      CINEWISE_CONTENT_NETSTART_BASE_URL: ${CINEWISE_CONTENT_NETSTART_BASE_URL:-https://apis.netstart.cn/maoyan}
      AMAP_WEATHER_ENABLED: ${AMAP_WEATHER_ENABLED:-false}
      AMAP_WEATHER_KEY: ${AMAP_WEATHER_KEY:-}
      CINEWISE_SCHEDULING_ENABLED: ${CINEWISE_SCHEDULING_ENABLED:-true}
      AUTH_VERIFICATION_HASH_SECRET: ${AUTH_VERIFICATION_HASH_SECRET:?AUTH_VERIFICATION_HASH_SECRET is required}
      AUTH_INVITE_HASH_SECRET: ${AUTH_INVITE_HASH_SECRET:?AUTH_INVITE_HASH_SECRET is required}
      AUTH_CURRENT_PRIVACY_POLICY_VERSION: ${AUTH_CURRENT_PRIVACY_POLICY_VERSION:?AUTH_CURRENT_PRIVACY_POLICY_VERSION is required}
      AUTH_INITIAL_INVITE_ENABLED: ${AUTH_INITIAL_INVITE_ENABLED:-false}
      TRAINING_INVITE_CODE: ${TRAINING_INVITE_CODE:-}
      AUTH_INITIAL_INVITE_MAX_USES: ${AUTH_INITIAL_INVITE_MAX_USES:-0}
      AUTH_INITIAL_INVITE_VALID_FROM: ${AUTH_INITIAL_INVITE_VALID_FROM:-}
      AUTH_INITIAL_INVITE_EXPIRE_TIME: ${AUTH_INITIAL_INVITE_EXPIRE_TIME:-}
      AUTH_VERIFICATION_SMTP_ENABLED: ${AUTH_VERIFICATION_SMTP_ENABLED:-false}
      AUTH_VERIFICATION_MAIL_FROM: ${AUTH_VERIFICATION_MAIL_FROM:-}
      AUTH_MAIL_DELIVERY_ENABLED: ${AUTH_MAIL_DELIVERY_ENABLED:-false}
      AUTH_MAIL_DELIVERY_PROVIDER: ${AUTH_MAIL_DELIVERY_PROVIDER:-smtp}
      AUTH_MAIL_DELIVERY_FROM: ${AUTH_MAIL_DELIVERY_FROM:-}
      AUTH_VIEWING_REMINDER_MAIL_SUBJECT: ${AUTH_VIEWING_REMINDER_MAIL_SUBJECT:-}
      AUTH_VIEWING_REMINDER_MAIL_BODY: ${AUTH_VIEWING_REMINDER_MAIL_BODY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_SSL_ENABLED: ${SMTP_SSL_ENABLED:-false}
      SMTP_STARTTLS_ENABLED: ${SMTP_STARTTLS_ENABLED:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-false}
      SMTP_TEST_CONNECTION: ${SMTP_TEST_CONNECTION:-false}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      SEED_FIXED_VALUE: ${SEED_FIXED_VALUE:-20260802}
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8080}:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep UP"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8000}:80
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"root\"></div>'"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    driver: bridge
