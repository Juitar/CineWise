name: Backend MySQL Integration

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-mysql-integration.yml"
      - "openspec/changes/ci-mysql-integration-verification/**"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-mysql-integration.yml"
      - "openspec/changes/ci-mysql-integration-verification/**"

permissions:
  contents: read

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          TZ: Asia/Shanghai
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: cinewise_ticketing_concurrency_check
          MYSQL_USER: cinewise_ci
          MYSQL_PASSWORD: cinewise-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TZ: Asia/Shanghai
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: cinewise_ticketing_concurrency_check
      MYSQL_USER: cinewise_ci
      MYSQL_PASSWORD: cinewise-ci-only
      JWT_SECRET: cinewise-ci-jwt-secret-at-least-32-bytes-long
      AUTH_AUDIT_HASH_SECRET: cinewise-ci-audit-secret-at-least-32-bytes-long
      CINEWISE_MYSQL_IT: "true"
      CINEWISE_MYSQL_CONCURRENCY_IT: "true"
      CINEWISE_MYSQL_LIFECYCLE_IT: "true"
      CINEWISE_MYSQL_PAYMENT_IT: "true"
      CINEWISE_MYSQL_REFUND_IT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run MySQL 8.4 integration tests
        working-directory: backend
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=ShowQueryMySqlIntegrationTest,OrderCreationMySqlConcurrencyIntegrationTest,OrderLifecycleMySqlIntegrationTest,PaymentMySqlIntegrationTest,RefundMySqlIntegrationTest
          test
