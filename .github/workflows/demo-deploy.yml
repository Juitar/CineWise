name: Demo Deploy

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "!backend/src/main/resources/db/migration/**"
      - "frontend/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinewise-demo-deployment
  cancel-in-progress: true

jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          TZ: Asia/Shanghai
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: cinewise_ticketing_concurrency_check
          MYSQL_USER: cinewise_ci
          MYSQL_PASSWORD: cinewise-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TZ: Asia/Shanghai
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: cinewise_ticketing_concurrency_check
      MYSQL_USER: cinewise_ci
      MYSQL_PASSWORD: cinewise-ci-only
      SPRING_FLYWAY_TARGET: latest
      JWT_SECRET: cinewise-ci-jwt-secret-at-least-32-bytes-long
      AUTH_AUDIT_HASH_SECRET: cinewise-ci-audit-secret-at-least-32-bytes-long
      AUTH_VERIFICATION_HASH_SECRET: cinewise-ci-verification-secret-at-least-32-bytes
      AUTH_INVITE_HASH_SECRET: cinewise-ci-invite-secret-at-least-32-bytes
      AUTH_CURRENT_PRIVACY_POLICY_VERSION: 2026-08-03
      CINEWISE_MYSQL_IT: "true"
      CINEWISE_MYSQL_CONCURRENCY_IT: "true"
      CINEWISE_MYSQL_LIFECYCLE_IT: "true"
      CINEWISE_MYSQL_PAYMENT_IT: "true"
      CINEWISE_MYSQL_REFUND_IT: "true"
      CINEWISE_MYSQL_PAID_TRAVEL_RECONCILIATION_IT: "true"
      CINEWISE_MYSQL_REFUNDED_TRAVEL_RECONCILIATION_IT: "true"
      CINEWISE_MYSQL_ADMIN_ORDER_IT: "true"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Create migration and Agent integration databases
        env:
          MYSQL_PWD: root-ci-only
        run: >-
          mysql --protocol=tcp -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u root
          -e "CREATE DATABASE cinewise_migration_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          CREATE DATABASE cinewise_agent_it CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          GRANT ALL PRIVILEGES ON cinewise_migration_ci.* TO 'cinewise_ci'@'%';
          GRANT ALL PRIVILEGES ON cinewise_agent_it.* TO 'cinewise_ci'@'%';"
      - name: Verify latest Flyway migrations on empty MySQL
        working-directory: backend
        env:
          MYSQL_DATABASE: cinewise_migration_ci
          CINEWISE_MYSQL_MIGRATION_IT: "true"
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=FlywayLatestMySqlIntegrationTest
          test
      - name: Run MySQL 8.4 integration tests
        working-directory: backend
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=ShowQueryMySqlIntegrationTest,OrderCreationMySqlConcurrencyIntegrationTest,OrderLifecycleMySqlIntegrationTest,PaymentMySqlIntegrationTest,RefundMySqlIntegrationTest,PaidTravelTaskReconciliationMySqlIntegrationTest,RefundedTravelTaskReconciliationMySqlIntegrationTest,AdminOrderQueryMySqlIntegrationTest
          test
      - name: Run Agent MySQL persistence integration tests
        working-directory: backend
        env:
          MYSQL_DATABASE: cinewise_agent_it
          CINEWISE_MYSQL_AGENT_PERSISTENCE_IT: "true"
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=AgentPersistenceMySqlIntegrationTest
          test
      - name: Repeat Agent Flyway initialization
        working-directory: backend
        env:
          MYSQL_DATABASE: cinewise_agent_it
          CINEWISE_MYSQL_AGENT_PERSISTENCE_IT: "true"
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress
          -Dtest=AgentPersistenceMySqlIntegrationTest
          test

  redis-integration:
    needs: [mysql-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_INTEGRATION_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: "6379"
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend with Redis integration enabled
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  frontend-e2e:
    needs: [redis-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production browser flow tests
        run: pnpm e2e:production
      - name: Run browser flow tests
        run: pnpm e2e
      - name: Run production Nginx smoke
        run: pnpm e2e:production-nginx

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: [frontend-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: demo
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact dev revision
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_path_base64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"

          ssh -i ~/.ssh/id_ed25519 \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_BASE64='$deploy_path_base64' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          # Compose 在部署服务器构建，必须启用 BuildKit 才能复用 Dockerfile 的 Maven cache mount。
          export DOCKER_BUILDKIT=1

          deploy_path="$(printf '%s' "$DEPLOY_PATH_BASE64" | base64 --decode)"
          cd "$deploy_path"

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Deployment repository has tracked local changes; refusing to overwrite them." >&2
            exit 1
          fi

          if [[ ! -f .env ]]; then
            echo "Deployment .env is missing." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*FLYWAY_ENABLED[[:space:]]*=[[:space:]]*(true|1|yes)[[:space:]]*$' .env; then
            echo "CD must not execute Flyway migrations; set FLYWAY_ENABLED=false." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*SEED_ENABLED[[:space:]]*=[[:space:]]*(true|1|yes)[[:space:]]*$' .env; then
            echo "CD must not run seed initialization; set SEED_ENABLED=false." >&2
            exit 1
          fi

          previous_sha="$(git rev-parse HEAD)"
          git fetch --prune origin dev
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git checkout --detach "$DEPLOY_SHA"

          if docker compose config --quiet \
            && docker compose --progress=plain build \
            && docker compose up -d --remove-orphans --wait --wait-timeout 240; then
            docker compose ps
            echo "Deployed $DEPLOY_SHA successfully."
            exit 0
          fi

          echo "Deployment failed; restoring $previous_sha." >&2
          git checkout --detach "$previous_sha"
          docker compose config --quiet
          docker compose --progress=plain build
          docker compose up -d --remove-orphans --wait --wait-timeout 240
          docker compose ps
          echo "Rollback completed; the failed deployment remains reported as failed." >&2
          exit 1
          REMOTE
