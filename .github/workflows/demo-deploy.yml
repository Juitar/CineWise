name: Demo Deploy

on:
  push:
    branches: [dev]
    paths:
      - "backend/**"
      - "!backend/src/main/resources/db/migration/**"
      - "frontend/**"
      - "compose.yaml"
      - ".env.example"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinewise-demo-deployment
  cancel-in-progress: false

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  frontend-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Set up pnpm 10.34.5
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Set up Node 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend quality gate
        run: pnpm check
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser flow tests
        run: pnpm e2e

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: [backend-verify, frontend-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: demo
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST is required}"
          : "${DEPLOY_USER:?DEPLOY_USER is required}"
          : "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY is required}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy exact dev revision
        shell: bash
        run: |
          set -Eeuo pipefail
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_path_base64="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"

          ssh -i ~/.ssh/id_ed25519 \
            -p "$deploy_port" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH_BASE64='$deploy_path_base64' DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          deploy_path="$(printf '%s' "$DEPLOY_PATH_BASE64" | base64 --decode)"
          cd "$deploy_path"

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Deployment repository has tracked local changes; refusing to overwrite them." >&2
            exit 1
          fi

          if [[ ! -f .env ]]; then
            echo "Deployment .env is missing." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*FLYWAY_ENABLED[[:space:]]*=[[:space:]]*(true|1|yes)[[:space:]]*$' .env; then
            echo "CD must not execute Flyway migrations; set FLYWAY_ENABLED=false." >&2
            exit 1
          fi

          if grep -Eiq '^[[:space:]]*SEED_ENABLED[[:space:]]*=[[:space:]]*(true|1|yes)[[:space:]]*$' .env; then
            echo "CD must not run seed initialization; set SEED_ENABLED=false." >&2
            exit 1
          fi

          previous_sha="$(git rev-parse HEAD)"
          git fetch --prune origin dev
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git checkout --detach "$DEPLOY_SHA"

          if docker compose config --quiet \
            && docker compose --progress=plain build \
            && docker compose up -d --remove-orphans --wait --wait-timeout 240; then
            docker compose ps
            echo "Deployed $DEPLOY_SHA successfully."
            exit 0
          fi

          echo "Deployment failed; restoring $previous_sha." >&2
          git checkout --detach "$previous_sha"
          docker compose config --quiet
          docker compose --progress=plain build
          docker compose up -d --remove-orphans --wait --wait-timeout 240
          docker compose ps
          echo "Rollback completed; the failed deployment remains reported as failed." >&2
          exit 1
          REMOTE
