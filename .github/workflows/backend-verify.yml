name: Backend Verify

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: backend-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: changes
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: >-
          bash .github/scripts/detect-ci-changes.sh
          backend/
          .github/workflows/backend-verify.yml
          .github/scripts/detect-ci-changes.sh
      - name: Set up Java 21
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend
        if: steps.changes.outputs.run == 'true'
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
