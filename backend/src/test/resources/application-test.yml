spring:
  datasource:
    url: jdbc:h2:mem:cinewise;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
  main:
    banner-mode: "off"

management:
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
