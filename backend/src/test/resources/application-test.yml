spring:
  datasource:
    url: jdbc:h2:mem:cinewise-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      repositories:
        enabled: false
  flyway:
    enabled: true
    # H2 只提供快速反馈；V010 起的 MySQL 专属 DDL 由一次性 MySQL 8.4 CI 验证。
    target: "009"
  main:
    banner-mode: "off"

management:
  health:
    redis:
      enabled: false

cinewise:
  auth:
    jwt-secret: test-jwt-secret-at-least-32-bytes-long
    audit-hash-secret: test-audit-secret-at-least-32-bytes-long
    registration:
      invite-hash-secret: test-invite-secret-at-least-32-bytes-long
      current-privacy-policy-version: 2026-08-03
      initial-invite:
        enabled: false
        code: ""
        max-uses: 0
        valid-from: ""
        expire-time: ""
    verification:
      hash-secret: test-verification-secret-at-least-32-bytes-long
      mail:
        smtp-enabled: false
    cookie-secure: false
    login-log-cleanup-delay-milliseconds: 86400000
  transaction:
    expiry-job-enabled: false
    paid-travel-reconciliation:
      enabled: false
    refunded-travel-reconciliation:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
