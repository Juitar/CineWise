spring:
  application:
    name: cinewise-backend
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    # 字段确认门通过并生成正式迁移后，部署环境才允许显式开启。
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-migration-naming: true
  threads:
    virtual:
      enabled: false
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    test-connection: ${SMTP_TEST_CONNECTION:false}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          ssl:
            enable: ${SMTP_SSL_ENABLED:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLED:true}
            required: ${SMTP_STARTTLS_REQUIRED:false}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MILLISECONDS:1500}
          timeout: ${SMTP_READ_TIMEOUT_MILLISECONDS:1500}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MILLISECONDS:1500}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

management:
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:${AUTH_VERIFICATION_SMTP_ENABLED:false}}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

cinewise:
  agent:
    event-cleanup-cron: "${AGENT_EVENT_CLEANUP_CRON:0 30 2 * * *}"
    deepseek:
      # 真实调用只由部署环境显式打开；默认 Mock 保障本地和单元测试不访问外部模型。
      enabled: ${DEEPSEEK_ENABLED:false}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      timeout: ${DEEPSEEK_TIMEOUT:5s}
  content:
    demo-ttl: 6h
    cache-ttl: 6h
    max-stale: 7d
    netstart:
      # 仅学习/演示环境可显式打开；本地保护阈值并非第三方公布配额。
      enabled: ${CINEWISE_CONTENT_NETSTART_ENABLED:false}
      # 受控验证时显式开启；应用就绪后只调用一次同步，不提供公网刷新接口。
      sync-on-startup: ${CINEWISE_CONTENT_NETSTART_SYNC_ON_STARTUP:false}
      # 城市单次导入会优先使用完整请求预算；此时关闭影片同步，避免杭州请求被本地限流拒绝。
      sync-movies-on-startup: ${CINEWISE_CONTENT_NETSTART_SYNC_MOVIES_ON_STARTUP:true}
      # 受控验证可替换为不可路由地址验证超时和回退；默认仍是学习来源，不进入生产环境。
      base-url: ${CINEWISE_CONTENT_NETSTART_BASE_URL:https://apis.netstart.cn/maoyan}
      daily-sync-cron: "${CINEWISE_CONTENT_NETSTART_DAILY_SYNC_CRON:0 0 3 * * *}"
      connect-timeout: 500ms
      read-timeout: 1500ms
      requests-per-minute: 10
      retry-count: 1
      retry-backoff: 200ms
      sync-cities: ${CINEWISE_CONTENT_NETSTART_SYNC_CITIES:430100}
  travel:
    route:
      amap:
        enabled: ${AMAP_ROUTE_ENABLED:false}
        key: ${AMAP_ROUTE_KEY:}
        connect-timeout: 2s
        read-timeout: 5s
        result-ttl: 15m
    weather:
      amap:
        # 启用且 key 存在时才查询高德；key 仅从环境变量读取，禁止提交到仓库。
        enabled: ${AMAP_WEATHER_ENABLED:false}
        key: ${AMAP_WEATHER_KEY:}
        cache-ttl: 15m
        # 高德天气按行政区码查询；这里只登记当前 Demo 影院所在区域，不接收用户位置。
        area-adcodes:
          "[西湖区]": "330106"
          "[滨江区]": "330108"
          "[拱墅区]": "330105"
          "[上城区]": "330102"
        # 只有本地登记的城市名称才可作为区域缺失时的备用，不根据模糊地址猜测。
        city-adcodes:
          "[杭州市]": "330100"
    food:
      radius-default-meters: ${TRAVEL_FOOD_RADIUS_DEFAULT_METERS:1000}
      radius-min-meters: ${TRAVEL_FOOD_RADIUS_MIN_METERS:300}
      radius-max-meters: ${TRAVEL_FOOD_RADIUS_MAX_METERS:3000}
  seed:
    # 演示数据必须显式开启；启动仅补齐固定 Demo，真实影院 Mock 由每日任务生成。
    enabled: ${SEED_ENABLED:false}
    fixed-value: ${SEED_FIXED_VALUE:20260802}
    live-demo-cron: "${SEED_LIVE_DEMO_CRON:0 10 3 * * *}"
  transaction:
    ticket-lock-minutes: ${TICKET_LOCK_MINUTES:15}
    order-payment-minutes: ${ORDER_PAYMENT_MINUTES:15}
    expiry-job-enabled: ${ORDER_EXPIRY_JOB_ENABLED:true}
    expiry-job-delay-milliseconds: ${ORDER_EXPIRY_JOB_DELAY_MILLISECONDS:30000}
    expiry-batch-size: ${ORDER_EXPIRY_BATCH_SIZE:100}
    # 已支付票在场次结束后仅失效电子票，不改变订单或已售座位。
    show-end-invalidation-job-enabled: ${SHOW_END_INVALIDATION_JOB_ENABLED:true}
    show-end-invalidation-job-delay-milliseconds: ${SHOW_END_INVALIDATION_JOB_DELAY_MILLISECONDS:60000}
    show-end-invalidation-batch-size: ${SHOW_END_INVALIDATION_BATCH_SIZE:100}
    paid-travel-reconciliation:
      # PAID与REFUNDED补偿共同收敛进程内事件遗漏，均可由运维独立停用排障。
      enabled: ${PAID_TRAVEL_RECONCILIATION_ENABLED:true}
      delay-milliseconds: ${PAID_TRAVEL_RECONCILIATION_DELAY_MILLISECONDS:300000}
      window-hours: ${PAID_TRAVEL_RECONCILIATION_WINDOW_HOURS:24}
      batch-size: ${PAID_TRAVEL_RECONCILIATION_BATCH_SIZE:100}
    refunded-travel-reconciliation:
      # 退款事件消费失败时，按REFUNDED权威状态确保D任务进入取消终态。
      enabled: ${REFUNDED_TRAVEL_RECONCILIATION_ENABLED:true}
      delay-milliseconds: ${REFUNDED_TRAVEL_RECONCILIATION_DELAY_MILLISECONDS:300000}
      window-hours: ${REFUNDED_TRAVEL_RECONCILIATION_WINDOW_HOURS:24}
      batch-size: ${REFUNDED_TRAVEL_RECONCILIATION_BATCH_SIZE:100}
  ticketing:
    sandbox-import:
      base-price: 39.90
      row-count: 8
      seats-per-row: 10
      language-version: "国语 2D"
  api:
    default-page: 1
    default-page-size: 20
    max-page-size: 100
  security:
    cors:
      # 生产/演示入口必须通过环境变量显式加入，不能用 * 配合 Cookie。
      allowed-origins: ${CINEWISE_CORS_ALLOWED_ORIGINS:http://localhost:8000,http://localhost:5173}
  auth:
    jwt-secret: ${JWT_SECRET:}
    audit-hash-secret: ${AUTH_AUDIT_HASH_SECRET:${JWT_SECRET:}}
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:30m}
    renewal-threshold: ${AUTH_RENEWAL_THRESHOLD:10m}
    absolute-session-ttl: ${AUTH_ABSOLUTE_SESSION_TTL:8h}
    access-cookie-name: ${AUTH_ACCESS_COOKIE_NAME:cinewise_access_token}
    csrf-cookie-name: ${AUTH_CSRF_COOKIE_NAME:cinewise_csrf}
    csrf-header-name: X-XSRF-TOKEN
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: Lax
    login-log-retention-days: ${AUTH_LOGIN_LOG_RETENTION_DAYS:30}
    login-log-cleanup-delay-milliseconds: ${AUTH_LOGIN_LOG_CLEANUP_DELAY_MILLISECONDS:86400000}
    registration:
      invite-hash-secret: ${AUTH_INVITE_HASH_SECRET:}
      current-privacy-policy-version: ${AUTH_CURRENT_PRIVACY_POLICY_VERSION:}
      initial-invite:
        enabled: ${AUTH_INITIAL_INVITE_ENABLED:false}
        code: ${TRAINING_INVITE_CODE:}
        max-uses: ${AUTH_INITIAL_INVITE_MAX_USES:0}
        valid-from: ${AUTH_INITIAL_INVITE_VALID_FROM:}
        expire-time: ${AUTH_INITIAL_INVITE_EXPIRE_TIME:}
    verification:
      hash-secret: ${AUTH_VERIFICATION_HASH_SECRET:}
      digits: ${AUTH_VERIFICATION_DIGITS:6}
      ttl: ${AUTH_VERIFICATION_TTL:5m}
      cooldown: ${AUTH_VERIFICATION_COOLDOWN:60s}
      maximum-attempts: ${AUTH_VERIFICATION_MAXIMUM_ATTEMPTS:5}
      ip-window: ${AUTH_VERIFICATION_IP_WINDOW:5m}
      maximum-ip-requests: ${AUTH_VERIFICATION_MAXIMUM_IP_REQUESTS:10}
      mail:
        smtp-enabled: ${AUTH_VERIFICATION_SMTP_ENABLED:false}
        from: ${AUTH_VERIFICATION_MAIL_FROM:}
        subject: ${AUTH_VERIFICATION_MAIL_SUBJECT:妙语购票邮箱验证码}
    mail-delivery:
      enabled: ${AUTH_MAIL_DELIVERY_ENABLED:false}
      # mock 仅用于开发/演示，不代表真实邮箱已收到邮件。
      provider: ${AUTH_MAIL_DELIVERY_PROVIDER:smtp}
      from: ${AUTH_MAIL_DELIVERY_FROM:${AUTH_VERIFICATION_MAIL_FROM:}}
      viewing-reminder:
        subject: ${AUTH_VIEWING_REMINDER_MAIL_SUBJECT:}
        body: ${AUTH_VIEWING_REMINDER_MAIL_BODY:}
    demo-seed:
      enabled: ${AUTH_DEMO_SEED_ENABLED:false}
      user-email: ${AUTH_DEMO_USER_EMAIL:}
      user-password: ${AUTH_DEMO_USER_PASSWORD:}
      user-nickname: ${AUTH_DEMO_USER_NICKNAME:}
      admin-email: ${AUTH_DEMO_ADMIN_EMAIL:}
      admin-password: ${AUTH_DEMO_ADMIN_PASSWORD:}
      admin-nickname: ${AUTH_DEMO_ADMIN_NICKNAME:}
      privacy-policy-version: ${AUTH_DEMO_PRIVACY_POLICY_VERSION:}
  scheduling:
    # 真实内容验证窗口可关闭全部自动任务，再由启动一次性同步器手工触发唯一一次。
    enabled: ${CINEWISE_SCHEDULING_ENABLED:true}
    pool-size: 4
    thread-name-prefix: cinewise-job-
    shutdown-await-seconds: 30
  async:
    core-pool-size: 2
    max-pool-size: 8
    queue-capacity: 100
    thread-name-prefix: cinewise-async-
    shutdown-await-seconds: 30
  http-client:
    connect-timeout: 2s
    read-timeout: 5s

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    root: INFO
    com.miaoyu.ticket: INFO
