spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:cinewise}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:cinewise}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2s

logging:
  level:
    com.miaoyu.ticket: DEBUG

cinewise:
  content:
    netstart:
      # 开发环境默认拉取已确认的学习来源；排障时可显式设为 false，生产 profile 仍会拒绝该 Provider。
      enabled: ${CINEWISE_CONTENT_NETSTART_ENABLED:true}
