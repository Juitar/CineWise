map $uri $privacy_request_target {
    default $request_uri;
    ~^/api/v1/recommendation/distance-contexts/[^/]+/location$ /api/v1/recommendation/distance-contexts/[redacted]/location;
}

map $uri $privacy_referer {
    default $http_referer;
    ~^/api/v1/recommendation/distance-contexts/[^/]+/location$ "-";
}

log_format cinewise_privacy '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $privacy_request_target $server_protocol" '
                            '$status $body_bytes_sent "$privacy_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # The distance upload URL contains a one-time distanceContextId. This
    # server-level format overrides the inherited combined log so the raw
    # request target cannot be written by the frontend container.
    access_log /var/log/nginx/access.log cinewise_privacy;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    location = /index.html {
        # A location that declares add_header does not inherit the server-level
        # headers, so keep the security headers alongside the no-store policy.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Only content-hashed assets are immutable. Cache-Control intentionally
    # omits "always" so a temporary 404 is not cached for a year.
    location ~* "\.[0-9a-f]{8,}(?:\.async)?\.(?:js|mjs|css|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|eot|wasm)$" {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static asset requests must never fall back to the SPA shell. Returning
    # index.html for a missing script or stylesheet makes browsers reject it
    # because the response MIME type is text/html.
    location ~* \.(?:js|mjs|css|map|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|otf|eot|wasm)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
